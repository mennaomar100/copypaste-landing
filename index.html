<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CopyPaste — The Game</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-muted-slate: #768E99;
      --color-light-blue:  #90A8B4;
      --color-deep-teal:   #1F5E80;
      --color-near-black:  #0B1215;
      --color-dark-slate:  #3A5661;
      --color-very-dark:   #1D2A30;
      
      --font-pixel: 'Press Start 2P', monospace;
      --font-main: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--color-near-black);
      font-family: var(--font-main);
      color: #ffffff;
    }

    body {
      background: linear-gradient(135deg, #0B1215 0%, #1D2A30 50%, #0B1215 100%);
      background-size: 200% 200%;
      animation: ambientBg 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    @keyframes ambientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(118, 142, 153, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(118, 142, 153, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 1;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(11, 18, 21, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.8;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 55%, rgba(11, 18, 21, 0.9) 100%);
      pointer-events: none;
      z-index: 3;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px) 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .frame-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--color-muted-slate);
      pointer-events: none;
      opacity: 0.6;
    }
    .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
    .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
    .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

    .screen {
      position: absolute;
      width: calc(100% - 48px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transform: scale(0.97) translateY(12px);
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .screen.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .screen.exit {
      opacity: 0;
      transform: scale(1.03) translateY(-12px);
      pointer-events: none;
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .reveal-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .game-title {
      font-family: var(--font-pixel);
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 
        3px 3px 0px var(--color-deep-teal),
        -1px -1px 0px var(--color-light-blue);
      letter-spacing: 2px;
      margin-bottom: 24px;
      position: relative;
    }

    .sub-tagline {
      font-size: 1.25rem;
      color: var(--color-light-blue);
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .impact-text {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .highlight-blue {
      color: var(--color-light-blue);
      text-shadow: 0 0 10px rgba(144, 168, 180, 0.4);
    }

    .highlight-teal {
      color: var(--color-deep-teal);
    }

    .mechanic-box {
      font-family: var(--font-pixel);
      font-size: 1.1rem;
      padding: 16px 24px;
      background: rgba(29, 42, 48, 0.85);
      border: 2px solid var(--color-light-blue);
      box-shadow: 0 0 15px rgba(31, 94, 128, 0.3);
      color: #ffffff;
      margin: 8px 0;
      width: 100%;
      max-width: 280px;
    }

    .achievement-card {
      background: rgba(29, 42, 48, 0.9);
      border: 2px solid var(--color-light-blue);
      box-shadow: inset 0 0 12px rgba(144, 168, 180, 0.2), 0 0 20px rgba(31, 94, 128, 0.4);
      padding: 24px 20px;
      width: 100%;
      margin-bottom: 24px;
      position: relative;
      clip-path: polygon(
        0 8px, 8px 0, 
        calc(100% - 8px) 0, 100% 8px, 
        100% calc(100% - 8px), calc(100% - 8px) 100%, 
        8px 100%, 0 calc(100% - 8px)
      );
    }

    .trophy-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
    }

    .badge-title {
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      color: var(--color-light-blue);
      margin-bottom: 8px;
    }

    .badge-subtitle {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
    }

    .form-group {
      width: 100%;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pixel-input {
      width: 100%;
      background: rgba(11, 18, 21, 0.95);
      border: 2px solid var(--color-muted-slate);
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 18px;
      font-weight: 600;
      padding: 16px;
      outline: none;
      transition: all 0.3s ease;
      clip-path: polygon(
        0 6px, 6px 0, 
        calc(100% - 6px) 0, 100% 6px, 
        100% calc(100% - 6px), calc(100% - 6px) 100%, 
        6px 100%, 0 calc(100% - 6px)
      );
      user-select: text;
    }

    .pixel-input:focus {
      border-color: var(--color-light-blue);
      box-shadow: 0 0 12px rgba(144, 168, 180, 0.4);
      background: rgba(29, 42, 48, 0.6);
    }

    .pixel-input::placeholder {
      color: var(--color-muted-slate);
      font-weight: 500;
    }

    .pixel-btn {
      width: 100%;
      background: var(--color-deep-teal);
      color: #ffffff;
      border: none;
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      padding: 18px 20px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4), inset 4px 4px 0px rgba(255,255,255,0.2);
    }
